name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display: xvfb-run --auto-servernum
            round: 1
          - os: macos-latest
            round: 1
          - os: macos-latest
            round: 2
          - os: macos-latest
            round: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: ${{ matrix.display }} cargo test -p volt-webview --test window -- --ignored diagnose_back
