name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo update
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: cargo test -p volt-http --all-targets --features browser

  browsers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display: xvfb-run --auto-servernum
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo update
      - name: Chrome without a window
        run: cargo test -p volt-chrome -- --ignored --skip shown
      - name: volt-http solving a challenge in Chrome
        if: ${{ !cancelled() }}
        run: cargo test -p volt-http --features browser --lib -- --ignored
      - name: Chrome with a window
        if: ${{ !cancelled() }}
        run: ${{ matrix.display }} cargo test -p volt-chrome -- --ignored shown
      - name: Webview with hidden pages
        if: ${{ !cancelled() }}
        run: ${{ matrix.display }} cargo test -p volt-webview -- --ignored --skip shown
      - name: Webview with shown windows
        if: ${{ !cancelled() }}
        run: ${{ matrix.display }} cargo test -p volt-webview --test window -- --ignored shown

  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo +1.95.0 update
      - run: cargo +1.95.0 test --workspace --all-targets
      - run: cargo +1.95.0 test --workspace --doc
      - run: cargo +1.95.0 test -p volt-http --all-targets --features browser

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo update
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo test --doc --workspace --all-features
