name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        ref: [main, fix-covered-check]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update
      - run: cargo test -p volt-webview --test window --no-run
      - name: The shared checks on hidden pages, 40 times
        run: |
          failed=0
          for round in $(seq 1 40); do
            if ! cargo test -p volt-webview --test window -- --ignored the_shared_checks_pass_on_hidden > round.log 2>&1; then
              failed=$((failed + 1))
              echo "round $round failed"
              grep -A6 'panicked' round.log
            fi
          done
          echo "failed rounds: $failed of 40"
          test "$failed" -eq 0
