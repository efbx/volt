name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  terminal-window:
    strategy:
      fail-fast: false
      matrix:
        ref: [diag-before, diag-after]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update
      - name: The tests of a program without an event loop
        run: cargo test -p volt-webview --test main_thread -- --ignored
