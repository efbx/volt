<!doctype html>
<meta charset="utf-8">
<title>List</title>
<h1>Teas</h1>
<ul id="teas">
  <li class="tea">Green <b>tea</b></li>
  <li class="tea">Black tea</li>
  <li class="tea" hidden>Hidden tea</li>
  <li class="tea"><a href="/next">Next page</a></li>
</ul>

<button id="far">Far below</button>
<p id="out"></p>
<script>

    document.getElementById("out").textContent = "reached";
  });
</script>
